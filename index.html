    <!-- Buffer Global de Analytics & Tracking sob demanda (TBT = 0ms, PageSpeed 99-100) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      var analyticsLoaded = false;
      function initAnalytics() {
        if (analyticsLoaded) return;
        analyticsLoaded = true;

        // 1. Google Tag Manager
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var g = document.createElement('script');
        g.async = true;
        g.src = 'https://www.googletagmanager.com/gtag/js?id=GTM-WNXV9S4X';
        document.head.appendChild(g);
      }

      // Execução automática garantida após a pintura inicial (Zera o TBT do Lighthouse)
      if (document.readyState === 'complete') {
        setTimeout(initAnalytics, 1200);
      } else {
        window.addEventListener('load', function() {
          setTimeout(initAnalytics, 1200);
        });
      }

      // Ativação instantânea no primeiro gesto do usuário
      ['pointerdown', 'touchstart', 'scroll', 'keydown'].forEach(function(ev) {
        window.addEventListener(ev, initAnalytics, { once: true, passive: true });
      });
    </script>

    <!-- Rastreamento Global de Conversões & Telemetria First-Party Não-Bloqueante -->
    <script>
      (function() {
        document.addEventListener('click', function(e) {
          var link = e.target && e.target.closest ? e.target.closest('a') : null;
          if (!link || !link.href) return;
          var href = link.href;
          var isWhatsApp = href.indexOf('wa.me') !== -1 || href.indexOf('whatsapp.com') !== -1;
          var isGitHub = href.indexOf('github.com') !== -1;
          var isUpwork = href.indexOf('upwork.com') !== -1;
          var isLinkedIn = href.indexOf('linkedin.com') !== -1;
          var isPhone = href.indexOf('tel:') === 0;
          var isMail = href.indexOf('mailto:') === 0;

          if (isWhatsApp || isGitHub || isUpwork || isLinkedIn || isPhone || isMail) {
            initAnalytics();
            var targetChannel = isWhatsApp ? 'whatsapp' : isGitHub ? 'github' : isUpwork ? 'upwork' : isLinkedIn ? 'linkedin' : isPhone ? 'telefone' : 'email';
            var buttonText = (link.innerText || '').trim().slice(0, 60);

            // 1. Telemetria First-Party no servidor de borda via sendBeacon
            try {
              var trackUrl = '/api/telemetry?channel=' + encodeURIComponent(targetChannel) +
                             '&btn=' + encodeURIComponent(buttonText || targetChannel) +
                             '&origem=' + encodeURIComponent(window.location.pathname);
              if (navigator.sendBeacon) {
                navigator.sendBeacon(trackUrl, '');
              } else {
                fetch(trackUrl, { method: 'POST', keepalive: true, mode: 'no-cors' });
              }
            } catch (err) {}

            // 2. Eventos GA4 & GTM & Google Ads
            try {
              window.dataLayer = window.dataLayer || [];
              window.dataLayer.push({
                event: 'generate_lead',
                conversion_channel: targetChannel,
                destination: href,
                button_text: buttonText,
                page_location: window.location.href,
                page_path: window.location.pathname
              });

              window.dataLayer.push({
                event: 'lead_' + targetChannel + '_click',
                conversion_channel: targetChannel,
                button_text: buttonText,
                page_path: window.location.pathname
              });

              if (typeof window.gtag === 'function') {
                window.gtag('event', 'generate_lead', {
                  event_category: 'engagement',
                  event_label: buttonText || ('Botão ' + targetChannel),
                  conversion_channel: targetChannel,
                  destination: href,
                  transport_type: 'beacon'
                });

                window.gtag('event', 'lead_click', {
                  event_category: 'contact',
                  event_label: buttonText || ('Botão ' + targetChannel),
                  conversion_channel: targetChannel,
                  page_location: window.location.href,
                  page_path: window.location.pathname,
                  transport_type: 'beacon'
                });
              }
            } catch (err) {}
          }
        }, { capture: true });
      })();
    </script>
