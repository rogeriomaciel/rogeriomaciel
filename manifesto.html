<!DOCTYPE html>
<html lang="pt-BR" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    
    <title>O Manifesto — Vender é um Discurso e Compra é uma Ação</title>
    <meta name="description" content="Nós acreditamos que a internet está saturada de sites bonitos que não vendem nada. Conheça o manifesto dos Sites de Alta Conversão." />
    <meta name="robots" content="index, follow" />

    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/manifesto.tsx"></script>
  </body>
</html>
